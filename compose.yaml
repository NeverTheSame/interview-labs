# Local stack for the labs and the app. `docker compose up -d` starts both.
name: interview-labs

services:
  ministack:
    # Pinned: MiniStack ships often and labs are checked against this version.
    image: ministackorg/ministack:1.5.38-full
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4566/_ministack/health')\""]
      interval: 5s
      retries: 20

  redis:
    # Plain Redis for the caching lab. MiniStack's ElastiCache would need the
    # Docker socket mounted; the commands you learn are the same.
    image: redis:7.4
    ports:
      - "${REDIS_PORT:-56379}:6379"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: labs
      POSTGRES_PASSWORD: labs
      POSTGRES_DB: labs
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
